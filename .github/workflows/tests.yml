name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r requirements.txt pytest
      - run: sh scripts/check_secret_history.sh
      - run: pytest -q
      - run: python -m compileall -q -x '/__pycache__/' .
      - run: python -m json.tool config.example.json >/dev/null
      - run: python -m json.tool _conf_schema.json >/dev/null
      - run: node -e 'const fs=require("fs");const html=fs.readFileSync("pages/dashboard/index.html","utf8");const script=html.match(/<script>([\s\S]*?)<\/script>/);if(!script)throw Error("inline script missing");new Function(script[1]);'
